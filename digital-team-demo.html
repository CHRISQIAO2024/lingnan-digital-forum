</style><header class="site-header demo-header"><div class="identity-row"><a class="brand" href="index.html#home"><img src="assets/forum-logo-original.png" alt="岭南数字论坛标识"><span>岭南数字论坛<small>LINGNAN DIGITAL FORUM</small></span></a><a class="committee-brand" href="committee.html"><span class="college-mark"><img src="assets/lingnan-college-logo-original.jpg" alt="中山大学岭南学院LOGO"></span><span><small>岭南广州校友会</small><b>科创与AI赋能专委会</b></span></a><a class="project" href="book.html">AI进化十步法 ↗</a></div></header><div class="workspace"><nav class="rail" aria-label="工作台导航"><button onclick="home()"><b>▦</b>数字员工</button><a href="book.html"><b>▤</b>项目首页</a></nav><aside><h2>我的数字员工</h2><input id="lookup" aria-label="搜索通讯录" placeholder="搜索员工姓名或岗位"><nav id="directory"></nav></aside><main id="main"></main></div><script>
const staff=[
['客户需求分析师','访','#d6e8d9','把客户原话整理成需求摘要和下一轮访谈问题。','分析客户访谈','我们有 8 个销售，每次拜访后都要写纪要。大家写法不一样，主管周五还得逐个问，下周该跟进谁。','需求摘要：纪要格式不统一，主管需要逐人确认跟进事项。','能否用最近一次拜访走一遍记录和跟进流程？\n主管每周花多少时间汇总？\n销售和主管分别需要哪些字段？','追问清单'],
['课程设计师','课','#f1dfbf','把培训目标拆成一节可以直接试讲的课程。','设计练习','给销售团队设计一节 30 分钟的 AI 纪要课。','课程目标：每人能从访谈中提取客户需求与下一步行动。','5 分钟：对比两份纪要。\n15 分钟：用同一段访谈练习提炼行动项。\n10 分钟：交换检查负责人和截止时间。','课程安排'],
['培训项目助理','项','#dce2f1','按培训时间整理筹备事项和负责人。','整理筹备事项','周五下午开课，讲师、教室和学员名单需要确认。','交付目标：课前完成三项确认。','项目经理：确认讲师与课件。\n行政：确认教室和投屏。\n班主任：确认名单并通知学员。','筹备清单'],
['资料研究员','研','#eadcee','从待核实的案例中提取证据缺口。','核查案例材料','供应商说客户使用工具后节约了一半时间。','目前只有供应商陈述，节省时间的口径待核实。','索取前后两次计时记录。\n确认是否为同类任务。\n向使用者核实返工和复核时间。','核查清单'],
['内容编辑','编','#f1dcd1','将活动信息改写成读者能直接使用的通知。','起草课程通知','周五 14 点在二楼会议室上纪要课，每人带一份脱敏记录。','面向学员的课前通知已整理。','本周五 14:00，请到二楼会议室参加纪要练习课。请提前准备一份脱敏的拜访记录，现场将用它练习提炼跟进事项。','课程通知'],
['复盘助手','复','#dde6c7','根据试点记录梳理成效和下轮调整事项。','复盘一次试点','5 人试用纪要模板，4 人按时提交，2 份缺少负责人。','本轮观察：按时提交 4 人，另有 2 份记录缺少负责人。','模板中单列负责人。\n提交前检查行动项。\n下轮记录按时提交数和字段缺失数。','改进清单']];
const el=id=>document.getElementById(id);let selected=-1,query='';
const icon=(r,mini='')=>'<span class="icon '+mini+'" style="background:'+r[2]+'">'+['👩🏻‍💼','👨🏻‍🏫','👩🏽‍💻','🧑🏻‍💻','👩🏻‍🎨','👨🏻‍💼'][staff.indexOf(r)]+'</span>';
function directory(){const q=el('lookup').value.trim();el('directory').innerHTML=staff.map((r,i)=>r[0].includes(q)?'<button class="'+(selected===i?'active':'')+'" onclick="chat('+i+')">'+icon(r,'mini')+'<span>'+r[0]+'<small>工号 00'+(i+1)+' · 可用</small></span>'+'</button>':'').join('')||'<p>没有匹配的员工</p>'}
function cards(){const list=staff.map((r,i)=>[r,i]).filter(([r])=>(r[0]+r[3]).includes(query.trim()));el('count').textContent=list.length+' 位员工';el('grid').innerHTML=list.map(([r,i])=>'<article><div class="employee">'+icon(r)+'<div><h2>'+r[0]+'</h2><span class="employee-id">v1.0 · 工号 00'+(i+1)+'</span></div><small class="status">● 可用</small></div><p>'+r[3]+'</p><div class="card-actions"><small>企业培训团队</small><button class="go" onclick="chat('+i+')">开始会话 →</button></div></article>').join('')||'<p>没有匹配的员工，请换个关键词。</p>'}
function home(){selected=-1;directory();el('main').innerHTML='<div class="bar"><strong>我的团队</strong><span>数字员工工作台</span></div><div class="head"><div><h1>我的团队</h1><p>企业培训团队 · <span id="count"></span></p></div></div><div class="filterrow"><strong>我的数字员工</strong><input id="search" placeholder="搜索员工或工作内容" aria-label="搜索团队"></div><div id="grid" class="grid"></div>';el('search').value=query;el('search').oninput=e=>{query=e.target.value;cards()};cards()}
function chat(i){selected=i;directory();const r=staff[i];el('main').innerHTML='<button onclick="home()">← 我的团队</button><div class="panel">'+icon(r)+'<h1>'+r[0]+'</h1><p>'+r[3]+'</p><hr><h2>'+r[4]+'</h2><small>本地示例演示 · 使用预置材料和结果</small><p><button id="load">载入示例材料</button></p><textarea readonly aria-label="示例材料" id="material" placeholder="点击上方按钮载入材料"></textarea><button class="go" id="run" disabled>提交任务 →</button></div><div id="result" aria-live="polite"></div>';el('load').onclick=()=>{el('material').value=r[5];el('run').disabled=false};el('run').onclick=()=>{el('result').innerHTML='<section class="panel"><small>任务已完成</small><p>'+r[6]+'</p><h2>'+r[8]+'</h2><pre id="output">'+r[7]+'</pre><button id="copy">复制'+r[8]+'</button></section>';el('copy').onclick=async()=>{try{await navigator.clipboard.writeText(r[7]);el('copy').textContent='已复制'}catch{const range=document.createRange();range.selectNodeContents(el('output'));const selection=getSelection();selection.removeAllRanges();selection.addRange(range);el('copy').textContent='已选中文字，请手动复制'}};el('result').scrollIntoView({behavior:'smooth',block:'nearest'})}}
el('lookup').oninput=directory;home();
</script></html>
